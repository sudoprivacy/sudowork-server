name: CI

on:
  push:
    branches: [dev, comac]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-12)" >> $GITHUB_OUTPUT

      - name: Build Docker image (${{ matrix.platform }})
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=docker,dest=./image-${{ matrix.arch }}.tar
          tags: 10.0.1.22:80/dev/sudoclaw-server:${{ steps.sha.outputs.short }}-${{ matrix.arch }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          retention-days: 7
